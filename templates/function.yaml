# 未归类函数模板 — 复制到 <project>/.artifacts/functions/<name>.yaml
schema_version: 1
name: <函数名>
locator: <地址 | 字节码偏移>                      # 语言无关定位
status: draft | candidate | confirmed
signature: <签名>
return_type: <类型>
anchor_path: <对应 anchor 载体路径>
retry:                                          # 逆向假设验证轮次（judge 核对，spec §5.3）
  count: 0
  over_cap: false
  history: []
uncertain_areas:
  - '<具体未知项>'
notes: |
  <函数用途推测、调用来源、待归类方向>
