    kind: evidence
    status: candidate
    # 结论摘要：WG_FLAT_TOP（去 min/squeeze/mul 虚分派 4→2）与生产逐位一致（block_probe -save out_prod.bin vs out_flat.bin SHA256 identical=True）。
    # 性能结果：10.55× ≈ 生产 10.32× → 虚分派数无碍（负面结论，排除项）。逐位一致保证此负面结论可信（改生产路径后 block_probe 对拍纪律）。

