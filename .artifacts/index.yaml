    # 结论摘要：2026-08-23/24 的 11× 争用定位完整过程时间线草稿（DFC 失败定论→locFn A/B→递归→虚分派→wrapper 链隔离→warm→WG_FLAT_TOP→latency QoS 收敛→M3 探针 bug），
