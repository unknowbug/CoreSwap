    # 结论摘要：production density 并发 11× 争用完整排查过程日志（DFC 失败定论→SERIAL/NOSPLIT/DEVIRT/spline-only/warm/WG_FLAT_TOP 排除链→interp/noodle 采样内部→latency QoS 归因→M3 探针 bug）。
