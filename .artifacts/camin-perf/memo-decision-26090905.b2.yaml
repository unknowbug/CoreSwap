## 1. #101 三证原始推理链重建（静态，无 shell）
three_proofs_original:
  p1_单读价: "44ms ÷ 853k ≈ 51ns/读 → 判定『mutex+hash 量级，近下限 → 单读不贵』（E4b）"
  p2_读放大: "on 853k vs off 7.5k = 114× → 成本主体是读量放大（E4b）"
  p3_语义同构: "[CA-READS] per-feature 分布（seagrass≈53% + ore/disk/monster_room）与 feature 工作量同构 → 放大是语义正确的固有工作，非病态循环（E4c）"
  original_verdict: "单读不贵 + 放大有语义解释 → 不治单价、不治读量 → 不立项 memo 化"

## 2. 新证据逐证核对（是否推翻）
verdict_per_proof:
  p1_单读价: "部分推翻（方向反了）——51ns 被原文标为『近下限』，但它实为 mutex lock + hash + Arc clone + 数组读的『同步结构成本』，不是物理下限。点级重复率 98% 意味着理论可用 O(1) 单槽 last-point cache（一次元组比较，~1-2ns）替代 98% 的 51ns 查找——每读成本是**结构可消**的，#101 判据①『近下限』措辞不成立。"
  p2_读放大: "部分混淆——114× vs off 臂确为语义面（-1 早退 vs 真实判定），这一半成立；但 MEMODIAG 显示 843k 读/唯一列 288 ≈ 每唯一列 ~2900 次读、点级重复 98%：**读调用次数 ≠ 语义必需的信息量**。语义必需的只有 ~288 列/chunk 的信息，其余是同一信息被同步查找结构反复搬运。#101 判据②把『调用次数放大』整体归给语义，混淆了『信息量固有』与『调用结构可消』两层。"
  p3_语义同构: "未被推翻但证明力不足——分布同构只排除『病态冗余循环』，不能区分『每次读都是新语义判定』vs『同点反复读』；98% 点级重复率正是它未覆盖的维度。"
  conclusion_of_check: "#101 的三证在其测量维度内都真实，但其判别式缺第四维（重复率/唯一信息量），导致『固有成本』整体裁定不成立——只对『信息量』这一半成立。"

