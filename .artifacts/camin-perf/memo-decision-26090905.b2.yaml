## 4. 结论
verdict: 收窄
verdict_detail: "#101 裁定不维持原样，也非整体推翻——收窄为：『语义必需的**信息量**固有（~288 唯一列/chunk、vs off 臂的 -1 早退差为真），但**读调用次数的 98% 重复**与**每读 51ns 同步结构成本**均为结构可消』。原『不立项』结论应降级：至少对『点级 last-value memo』这一最低风险候选重新立项评估（prototype bench + hash 门），而非维持不作为。"
