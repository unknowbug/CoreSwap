# fan-out worker B3 候选 · 260909-05
id: memo-decision-26090905.b3
status: draft
confidence: candidate-track (静态+成本模型，Degraded 分层：未跑任何命令，全部推引自已验证实测数据)
hypothesis: >
  ca_min 残差优化立项 = 结构性去同步（per-chunk 邻域列预取快照 / 无锁读路径），
