   循环调 neighbor_terrain 收 Arc）。
2. block_at_col 越界分支：先查快照（索引算术 + if let），miss 再 neighbor_terrain（原代码兜底保留）。
3. 行为回归：on/off 双 hash 对拍（6908dbfc9a79c40a / 115641b86711d9cd）+ 端到端 wall 对比
   （无探针整批，铁律），目标 on≈off±5%。
4. 可选前置探针（一轮成本）：MEMODIAG 加 (tcx-cx, tcz-cz) 直方图 + neighbor_terrain
   miss 计数，确认覆盖率和 P2——建议实现前先跑。
