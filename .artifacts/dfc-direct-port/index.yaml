## biome_perf 384us 异常解释（review-002 审查点 5）

`biome_perf` 与 `biome_hot` 同为 biome_of 测量，结果差 7×（384 vs 54us/pt），**测量方法不一致**：

- **biome_perf**（384us/pt）：`x=(i*7)&0xFFFF, z=(i*13)&0xFFFF` → **100k 不同坐标**，跨 65536×65536 范围，每点不同 chunk → **冷缓存**（6 参数噪声采样全重算 + 线性扫描 7593 行）
- **biome_hot**（54us/pt）：`lx=i%16, lz=(i/16)%16` → **同 chunk(0,0) 内 256 列**，flat_cache 命中 → **热缓存**

7× 差 = 冷缓存（每点重采样 6 参数噪声）vs 热缓存（flat_cache 命中）。这是「fresh-vs-cached」的同一区分（perf_fresh 已文档化）。**biome_perf 是冷缓存上界，biome_hot 是热缓存下界**，真实 fill_chunk 介于两者之间（每 chunk 内热、跨 chunk 冷）。此异常**已解释，非 bug**。

## 结论

**DFC 直排方向关闭**（density 非瓶颈，biome 是热点）：
- density 稳态已快（perf_fresh 0.10/0.06us/pt），DFC 直排优化 density 无收益
- biome 是真正热点（45-46%），已通过 SearchTree 优化（10× 扫描，fillbench 20%）
- **关闭理由修正**：删除「方案 B（spline 显式栈）无收益」的不可核实声明（该实验无提交/无回退/无输出记录）。关闭理由是「density 已快 + biome 是热点」，**不是**「方案 B 无收益」

