# DFC 直排方向评估（draft · 方向可关闭，理由已修正）

> 状态：**draft**（judge 审查后不升 candidate/confirmed，不写结论性 docs）
> 审查：`.investigations/dfc-direct-port/review-001-dfc-direction-closed.md` + `review-002-biome-perf-mt-dfc.md`
> 结论：**DFC 直排方向可关闭**（density 非瓶颈，biome 是热点），但关闭理由已修正——**不是**「方案 B 无收益」（该声明不可核实，已删除），而是「density 稳态已快 + biome 是真正热点」。

## 背景

CoreSwap Rust worldgen 性能优化。尝试 DFC 直排（density 树摊平消除运行时递归），初步结论「对 Rust 无意义，方向关闭」。judge 审查发现证据不足，暂缓关闭并补验证。

## judge 审查发现（review-001，三源核对）

1. **方案 B 实验不可核实**：spline 显式栈 fillbench 36.70 vs 34.68ms 无提交/无回退/无输出记录（数字全仓 0 命中）。不得声称「已回退」。
2. **perf_quant 纯树测量有缺陷**：单 chunk 缓存命中 + Interpolated grid 构建摊薄（踩 4635170 已文档化的坑「amortized grid build into per-point」）。6.4× 管线开销不干净。
3. **C++ 热点前提已证伪**：C++ 侧 2026-08-23 DEVIRT 实验证明虚调用非 11× 元凶（10.05× vs 10.32×）。perf_quant 结论基于已证伪前提。
4. **产物契约违规**：无 artifact、无 cmd-output 落盘。

## 补验证（review-001 建议 + review-002 跟进，全部完成）

- ✅ **fresh-vs-cached 分离**：perf_fresh 0.10 vs cached 0.06 us/pt（1.6×）——grid 构建影响小，density 稳态即快
- ✅ **组件量化**：fillprofile biome 占 46%（14.9/32.2ms）+ biome_fill 45%——**biome 分类是真正热点，非 density**
- ✅ **Rust 多线程/冷缓存并发争用**：mt_fill（Arc<Ctx> 共享 + thread_local 缓存）T=1 790ms → T=8 170ms（4.65× 扩展），mismatch=0/16——Rust 无 C++ 11× 争用
- ✅ **biome 根因**：biome_of 扫描成本 54us/pt（98%），因线性扫描 7593 行（53 biome × 多 depth/分档行），非 6 参数采样（0.9us）
- ✅ **SearchTree（KD-tree）**：移植 vanilla MultiNoiseUtil.SearchTree（TreeBranchNode enclosing 剪枝 + TreeLeafNode），扫描 30→2.9us/pt（10x），biome_of 31→3.8us/pt，fillbench 28.76→22.98ms（20%）。blocks_cmp 数值不变（93.49%）。提交 `f73c005`
- ✅ **depth 分桶正确性 bug 已修复**：dripstone/lush_caves depth[0.2,0.9] 跨 0.5 边界，d<0.5 时被错误排除。**放弃分桶，仅用 SearchTree**（本身已 10×）。cave_probe 验证洞穴 biome 正确识别（depth 0.474-0.736）。提交 `a51a062`/`dc07285`

