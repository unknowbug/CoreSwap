plugins {
    id 'fabric-loom' version '1.10.5'
}

version = '1.20.1-1.0.0'
group = 'wg'

base {
    archivesName = 'coreswap'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.0+1.20.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

loom {
    runs {
        // 公共 bench/替换参数：server 与 client 共用
        def benchVmArgs = { run ->
            def benchSeed = project.findProperty('benchSeed') ?: '-8248318472910187742'
            def benchSize = project.findProperty('benchSize') ?: '8'
            def benchOriginX = project.findProperty('benchOriginX') ?: '200'
            def benchOriginZ = project.findProperty('benchOriginZ') ?: '200'
            def benchOut = project.findProperty('benchOut') ?: 'E:/python/MC/data'
            run.vmArg "-Dbench.seed=${benchSeed}"
            run.vmArg "-Dbench.size=${benchSize}"
            run.vmArg "-Dbench.originX=${benchOriginX}"
            run.vmArg "-Dbench.originZ=${benchOriginZ}"
            run.vmArg "-Dbench.out=${benchOut}"
            if (project.findProperty('probeCount') != null) run.vmArg "-Dprobe.count=${project.findProperty('probeCount')}"
            if (project.findProperty('routerProbe') != null) run.vmArg "-Drouter.probe=true"
            if (project.findProperty('oreProbe') != null) run.vmArg "-Dore.probe=true"
            if (project.findProperty('blockProbe') != null) run.vmArg "-Dblock.probe=true"
            if (project.findProperty('biomeProbe') != null) run.vmArg "-Dbiome.probe=true"
            if (project.findProperty('jniProbe') != null) run.vmArg "-Djni.probe=true"
            if (project.findProperty('cppReplace') != null) run.vmArg "-Dcpp.replace=1"
            if (project.findProperty('cppDebug') != null) run.vmArg "-Dcpp.debug=1"
            if (project.findProperty('cppLib') != null) run.vmArg "-Dcpp.worldgen.lib=${project.findProperty('cppLib')}"
if (project.findProperty('compProbe') != null) {
    run.vmArg "-Dcomp.probe=true"
    if (project.findProperty('compX') != null) run.vmArg "-Dcomp.x=${project.findProperty('compX')}"
    if (project.findProperty('compZ') != null) run.vmArg "-Dcomp.z=${project.findProperty('compZ')}"
    if (project.findProperty('compY') != null) run.vmArg "-Dcomp.y=${project.findProperty('compY')}"
}
            if (project.findProperty('readWorldProbe') != null) run.vmArg "-DreadWorld.probe=true"
        }
        server {
            programArgs '--nogui'
            benchVmArgs(delegate)
            // 原生崩溃诊断：hs_err 写到固定路径（-1073741819/0xC0000005 时定位）
            vmArg "-XX:ErrorFile=E:/python/MC/versions/1.20.1/java/run/hs_err_%p.log"
        }
        client {
            benchVmArgs(delegate)
            vmArg "-XX:ErrorFile=E:/python/MC/versions/1.20.1/java/run/hs_err_%p.log"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
