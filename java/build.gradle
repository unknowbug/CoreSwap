plugins {
    id 'fabric-loom' version '1.10.5'
}

version = '0.1.0'
group = 'wg'

base {
    archivesName = 'worldgen-bench'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.0+1.20.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

loom {
    runs {
        server {
            programArgs '--nogui'
            // bench 参数：gradle runServer -PbenchSeed=<long> -PbenchSize=<int>
            def benchSeed = project.findProperty('benchSeed') ?: '-8248318472910187742'
            def benchSize = project.findProperty('benchSize') ?: '8'
            def benchOriginX = project.findProperty('benchOriginX') ?: '200'
            def benchOriginZ = project.findProperty('benchOriginZ') ?: '200'
            def benchOut = project.findProperty('benchOut') ?: 'E:/python/MC/data'
            vmArg "-Dbench.seed=${benchSeed}"
            vmArg "-Dbench.size=${benchSize}"
            vmArg "-Dbench.originX=${benchOriginX}"
            vmArg "-Dbench.originZ=${benchOriginZ}"
            vmArg "-Dbench.out=${benchOut}"
            // 探针模式：gradle runServer -PprobeCount=<int>
            if (project.findProperty('probeCount') != null) {
                vmArg "-Dprobe.count=${project.findProperty('probeCount')}"
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
